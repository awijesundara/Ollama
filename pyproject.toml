[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chainlit-ollama-memory"
version = "0.1.0"
description = "Multi-user persistent memory for Chainlit and Ollama"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "chainlit>=2.11.1,<2.12",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "ldap3>=2.9,<3",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-ldap3>=2.9,<3",
  "types-PyYAML>=6.0,<7",
]


[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a migrated disposable PostgreSQL database",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["src"]

[[tool.mypy.overrides]]
module = [
  "asyncpg",
  "chainlit",
  "chainlit.*",
  "fastapi",
  "httpx",
  "ldap3",
  "ldap3.*",
  "prometheus_client",
  "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "src.auth.identity",
  "src.chat.handlers",
  "src.ui.actions",
  "src.ui.settings",
]
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "src.database.chainlit_layer"
disable_error_code = ["misc"]
