name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chainlit
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: chainlit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chainlit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://chainlit:test-only-password@localhost:5432/chainlit_test
      TEST_DATABASE_URL: postgresql://chainlit:test-only-password@localhost:5432/chainlit_test
      APP_ENV: test
      STORAGE_BACKEND: encrypted_files
      ENCRYPTED_STORAGE_DIR: ${{ runner.temp }}/chainlit-ollama-memory/users
      ENCRYPTED_STORAGE_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic -x database_url="$DATABASE_URL" upgrade head
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: alembic -x database_url="$DATABASE_URL" downgrade base
      - run: alembic -x database_url="$DATABASE_URL" upgrade head
