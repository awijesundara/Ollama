name: chainlit-ollama-memory

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_BACKEND: encrypted_files
      ENCRYPTED_STORAGE_DIR: /data/users
      AUTH_MODE: header
      CHAINLIT_URL: http://localhost:${APP_PORT:-8000}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gpt-oss:20b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      MEMORY_VECTOR_SEARCH: ${MEMORY_VECTOR_SEARCH:-false}
      MEMORY_AUTO_EXTRACTION: ${MEMORY_AUTO_EXTRACTION:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/data/users
      - app-secrets:/run/app-secrets
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5)
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  app-data:
  app-secrets:
