version: 1
disable_existing_loggers: false
formatters:
  json:
    (): pythonjsonlogger.json.JsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(message)s %(correlation_id)s %(thread_id)s %(user_hash)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]

