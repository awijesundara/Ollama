[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = true
allow_origins = ["http://localhost:8000", "http://127.0.0.1:8000"]

[features]
unsafe_allow_html = false
latex = true
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = false
allow_thread_sharing = false
favorites = false

[features.spontaneous_file_upload]
enabled = true
accept = [
  "text/*",
  "application/pdf",
  "application/json",
  "application/xml",
  "application/epub+zip",
  "message/rfc822",
  "application/rtf",
  "application/gzip",
  "application/x-gzip",
  "application/x-tar",
  "application/zip",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/vnd.oasis.opendocument.text",
  "application/vnd.oasis.opendocument.presentation",
  "application/vnd.oasis.opendocument.spreadsheet",
  "image/*",
]
max_files = 10
max_size_mb = 10

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[UI]
name = "Private Ollama"
description = "Private AI chat with encrypted per-user history and memory"
default_theme = "dark"
layout = "wide"
default_sidebar_state = "open"
confirm_new_chat = true
chat_settings_location = "sidebar"
default_chat_settings_open = false
cot = "hidden"
alert_style = "modern"
custom_css = "/public/chat.css"
custom_js = "/public/chat.js"
logo_file_url = ""
default_avatar_file_url = ""

[meta]
generated_by = "2.11.1"
